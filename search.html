<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Results</title>
</head>
<body>

<h2>Search Results</h2>
<div id="results"></div>

<script>
  // Get search word from URL
  const params = new URLSearchParams(window.location.search);
  const query = params.get("q");

  const resultsDiv = document.getElementById("results");

  if (query) {

    if (query.toLowerCase().includes("home")) {
      resultsDiv.innerHTML = `<a href="index.html">Go to Home Page</a>`;
    } 
    else if (query.toLowerCase().includes("about")) {
      resultsDiv.innerHTML = `<a href="about.html">Go to About Page</a>`;
    } 
    else if (query.toLowerCase().includes("menu")) {
      resultsDiv.innerHTML = `<a href="menu.html">Go to Menu Page</a>`;
    } 
    else if (query.toLowerCase().includes("contact")) {
      resultsDiv.innerHTML = `<a href="contact.html">Go to Contact Page</a>`;
    } 
    else {
      resultsDiv.innerHTML = `<p>No results found for "<b>${query}</b>"</p>`;
    }

  }
</script>

</body>
</html>
